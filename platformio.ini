; Medidor RSSI LoRaWAN + GPS SIM808 - Heltec WiFi LoRa 32 V2
; Documentación de PlatformIO: https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V2]
; espressif32 6.9.0 incluye framework-arduinoespressif32 2.0.17 (Arduino-ESP32 2.x).
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -Wall

; Beelan LoRaWAN se usa desde lib/Beelan-LoRaWAN (versión modificada "fix_classC").
; La región (AU915) y la subbanda (SUBND_1) se fijan en su src/arduino-rfm/Config.h.
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    arkhipenko/TaskScheduler@^3.8.5
